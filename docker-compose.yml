services:
  vietframe:
    build: .
    ports:
      - '127.0.0.1:8010:8010'
    volumes:
      - ./workspace:/data
    environment:
      # Create account with a secret token when Docker's gateway IP is not loopback.
      VIETFRAME_SETUP_TOKEN: ${VIETFRAME_SETUP_TOKEN:-}
      VIETFRAME_COOKIE_SECURE: ${VIETFRAME_COOKIE_SECURE:-false}
    restart: unless-stopped
    mem_limit: 2g
